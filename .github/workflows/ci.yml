name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test

  build-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Purrpeek
        run: go build ./cmd/purrpeek
      - name: Run Purrpeek
        run: ./purrpeek

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Purrpeek
        run: go build ./cmd/purrpeek
      - name: Run Purrpeek
        run: ./purrpeek

  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install latest Linux release
        run: sh scripts/install.sh
      - name: Verify installation
        run: |
          command -v purrpeek
          purrpeek --help

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Windows setup
        run: cmd /c scripts\setup.bat
      - name: Run Purrpeek
        shell: pwsh
        run: .\bin\purrpeek.exe

  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: make nix-check
      - run: make nix-build
      - name: Run Purrpeek
        run: ./result/bin/purrpeek

  scoop:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Purrpeek bucket
        shell: pwsh
        run: |
          scoop bucket add nikhil25803 https://github.com/nikhil25803/scoop-bucket

      - name: Install Purrpeek
        shell: pwsh
        run: |
          scoop install purrpeek

      - name: Run Purrpeek
        shell: pwsh
        run: |
          purrpeek

  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Install Debian package
        run: |
          sudo apt install -y ./dist/*_linux_amd64.deb

      - name: Verify installation
        run: |
          command -v purrpeek
          purrpeek

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          dnf install -y curl git tar gzip

      - name: Install Go
        run: |
          curl -LO https://go.dev/dl/go1.26.5.linux-amd64.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf go1.26.5.linux-amd64.tar.gz
          export PATH="/usr/local/go/bin:$PATH"
          go version
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Install GoReleaser
        run: |
          curl -L https://github.com/goreleaser/goreleaser/releases/latest/download/goreleaser_Linux_x86_64.tar.gz \
            -o /tmp/goreleaser.tar.gz
          tar -xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser
          goreleaser --version

      - name: Build RPM
        run: |
          goreleaser release --snapshot --clean

      - name: Install RPM package
        run: |
          dnf install -y ./dist/*_linux_amd64.rpm

      - name: Verify installation
        run: |
          command -v purrpeek
          purrpeek
  aur:
    name: AUR Package
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman --disable-sandbox-syscalls -Sy --noconfirm \
            git \
            base-devel \
            namcap

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate PKGBUILD
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE/purrpeek-bin' && makepkg --printsrcinfo > .SRCINFO"
          su builder -c "cd '$GITHUB_WORKSPACE/purrpeek-bin' && namcap PKGBUILD"
          su builder -c "cd '$GITHUB_WORKSPACE/purrpeek-bin' && makepkg --syncdeps --noconfirm -f"

  debian-package:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y golang-go debhelper devscripts build-essential

      - name: Build Debian package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'dpkg-buildpackage -us -uc -b'
