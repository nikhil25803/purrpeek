name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test

  build-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Purrpeek
        run: go build ./cmd/purrpeek
      - name: Run Purrpeek
        run: ./purrpeek

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Purrpeek
        run: go build ./cmd/purrpeek
      - name: Run Purrpeek
        run: ./purrpeek

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Windows setup
        run: cmd /c scripts\setup.bat
      - name: Run Purrpeek
        shell: pwsh
        run: .\bin\purrpeek.exe

  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: make nix-check
      - run: make nix-build
      - name: Run Purrpeek
        run: ./result/bin/purrpeek

  scoop:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Purrpeek bucket
        shell: pwsh
        run: |
          scoop bucket add nikhil25803 https://github.com/nikhil25803/scoop-bucket

      - name: Install Purrpeek
        shell: pwsh
        run: |
          scoop install purrpeek

      - name: Run Purrpeek
        shell: pwsh
        run: |
          purrpeek

  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Install Debian package
        run: |
          sudo apt install -y ./dist/purrpeek_*.deb

      - name: Verify installation
        run: |
          command -v purrpeek
          purrpeek
